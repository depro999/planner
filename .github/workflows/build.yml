name: Build IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        run: |
          set -o pipefail
          PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          xcodebuild -list -project "$PROJECT"
          SCHEME=$(xcodebuild -list -json -project "$PROJECT" | python3 -c "import sys,json; print(json.load(sys.stdin)['project']['schemes'][0])")
          echo "Proyecto: $PROJECT  Esquema: $SCHEME"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r App.ipa Payload

      - name: Mostrar errores
        if: failure()
        run: grep -E "error:|BUILD FAILED" -B1 -A3 build.log | head -80

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: App.ipa
