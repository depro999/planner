name: Build IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        run: |
          PROJECT=$(find . -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          SCHEME=$(xcodebuild -list -json -project "$PROJECT" | python3 -c "import sys,json; print(json.load(sys.stdin)['project']['schemes'][0])")
          echo "Proyecto: $PROJECT  Esquema: $SCHEME"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          mkdir Payload
          cp -R "$APP" Payload/
          zip -r App.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: App.ipa
